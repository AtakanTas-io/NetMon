[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
    "backend/application.py",
    "backend/netdiag_core.py",
    "backend/desktop_app.py",
    "backend/fix_ports.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["frontend/chart.umd.js"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["backend/application.py"]
