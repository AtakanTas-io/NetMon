name: Security

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "17 4 * * 1"

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Güvenlik araçlarını kur
        run: python -m pip install pip-audit bandit
      - name: Bağımlılık açıklarını tara
        run: pip-audit -r requirements.txt
      - name: Python güvenlik taraması
        run: >-
          bandit -r backend -c pyproject.toml -ll
          -x backend/.buildenv,backend/build,backend/dist,backend/__pycache__
