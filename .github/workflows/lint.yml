name: Lint

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Kontrol araçlarını kur
        run: python -m pip install ruff mypy
      - name: Ruff denetimi
        run: ruff check .
      - name: Ruff biçim denetimi
        run: ruff format --check .
      - name: Mypy denetimi
        run: mypy backend --ignore-missing-imports
