[pytest]
testpaths = tests
# Windows'ta pytest geçici dizini temizlerken "PermissionError: [WinError 5]
# pytest-current" hatasıyla karşılaşılıyor. Proje dizini altında özel bir
# basetemp kullanarak sistem Temp klasörüne yazılmasını ve bu hatayı önlüyoruz.
tmp_path_retention_count = 3
tmp_path_retention_policy = failed

filterwarnings =
    # httpx → httpx2 geçiş uyarısı; testleri bozmaz, suppress edilebilir
    ignore::DeprecationWarning:starlette.testclient
    ignore::DeprecationWarning:httpx
    # SQLite WAL modu açık DB dosyaları hakkında ResourceWarning (SQLite3 içsel)
    ignore::ResourceWarning

# Kısa ama bilgilendirici traceback formatı
addopts = --tb=short -p no:cacheprovider --cov=backend --cov-report=term-missing --cov-fail-under=70
